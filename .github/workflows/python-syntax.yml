name: Python syntax check

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'cloud_history.py'
      - 'merge_ai.py'
      - '.github/workflows/python-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile application modules
        run: python -m py_compile app.py cloud_history.py merge_ai.py
