name: Python syntax check

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'cloud_history.py'
      - 'jarvis_control.py'
      - 'merge_ai.py'
      - 'desktop_bridge.py'
      - 'supabase_control_bridge.sql'
      - 'tests/**'
      - '.github/workflows/python-syntax.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'cloud_history.py'
      - 'jarvis_control.py'
      - 'merge_ai.py'
      - 'desktop_bridge.py'
      - 'supabase_control_bridge.sql'
      - 'tests/**'
      - '.github/workflows/python-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install requests pillow

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile application and desktop companion modules
        run: python -m py_compile app.py cloud_history.py jarvis_control.py merge_ai.py desktop_bridge.py
